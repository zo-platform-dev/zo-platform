services:
  # Main Backend Service
  - type: web
    name: zo-platform
    env: node
    plan: free
    region: frankfurt
    buildCommand: |
      echo "Installing backend dependencies..."
      cd backend && npm ci --only=production
      echo "Installing frontend dependencies..."
      cd ../frontend && npm ci
      echo "Building frontend..."
      npm run build
      echo "Build completed successfully!"
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
        sync: false
      - key: API_KEY_SECRET
        generateValue: true
        sync: false
      - key: FRONTEND_URL
        value: https://zo-platform.onrender.com
      - key: MAX_CONCURRENT_TASKS
        value: 3
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 500
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: true
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium-browser
    healthCheckPath: /health
    autoDeploy: true
